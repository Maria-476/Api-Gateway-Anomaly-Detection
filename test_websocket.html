<!DOCTYPE html>
<html>
<body>
    <h2>WebSocket Test</h2>
    <p id="output">Connecting...</p>

    <script>
        const ws = new WebSocket("ws://127.0.0.1:8000/ws");

        ws.onmessage = function(event) {
            document.getElementById("output").innerText = "Received: " + event.data;
        };
    </script>
</body>
</html>
